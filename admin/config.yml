backend:
  name: github
  repo: 你的github名字/astrowind
  branch: main
  client_id: 这里等下填OAuth的ClientID
media_folder: src/assets/images/uploads
public_folder: /assets/images/uploads
collections:
  - name: "products"
    label: "产品"
    folder: "src/content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "英文标题", name: "title_en", widget: "string"}
      - {label: "封面图", name: "image", widget: "image"}
      - {label: "简介", name: "desc", widget: "text"}
      - {label: "英文简介", name: "desc_en", widget: "text"}
      - {label: "详情内容", name: "body", widget: "markdown"}
      - {label: "英文详情", name: "body_en", widget: "markdown"}
  - name: "cases"
    label: "案例"
    folder: "src/content/cases"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "英文标题", name: "title_en", widget: "string"}
      - {label: "封面图", name: "image", widget: "image"}
      - {label: "简介", name: "desc", widget: "text"}
      - {label: "详情", name: "body", widget: "markdown"}
      - {label: "英文详情", name: "body_en", widget: "markdown"}
  - name: "news"
    label: "新闻"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "英文标题", name: "title_en", widget: "string"}
      - {label: "发布日期", name: "date", widget: "date"}
      - {label: "封面图", name: "image", widget: "image"}
      - {label: "内容", name: "body", widget: "markdown"}
      - {label: "英文内容", name: "body_en", widget: "markdown"}
  - name: "team"
    label: "团队成员"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "姓名", name: "name", widget: "string"}
      - {label: "英文名", name: "name_en", widget: "string"}
      - {label: "头像", name: "avatar", widget: "image"}
      - {label: "职位", name: "position", widget: "string"}
      - {label: "英文职位", name: "position_en", widget: "string"}
